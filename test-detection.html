<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Hermes Bridge — 反检测自测</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f1a; color: #e0e0e0; padding: 40px; line-height: 1.6;
  }
  h1 { font-size: 24px; margin-bottom: 8px; color: #fff; }
  .subtitle { color: #888; margin-bottom: 32px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .card {
    background: #1a1a2e; border: 1px solid #2d2d44; border-radius: 8px; padding: 20px;
  }
  .card h2 { font-size: 14px; margin-bottom: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
  .status { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; }
  .pass { background: #065f46; color: #6ee7b7; }
  .warn { background: #78350f; color: #fbbf24; }
  .fail { background: #7f1d1d; color: #fca5a5; }
  .detail { font-size: 13px; margin-top: 8px; color: #bbb; }
  .value { font-family: 'SF Mono', monospace; font-size: 12px; background: #0f0f1a; padding: 2px 8px; border-radius: 3px; color: #888; }
  .test-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 32px; }
  .btn {
    padding: 12px 24px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer;
    transition: all 0.15s; font-weight: 500;
  }
  .btn-primary { background: #6366f1; color: white; }
  .btn-primary:hover { background: #4f46e5; }
  .btn-danger { background: #dc2626; color: white; }
  .btn-danger:hover { background: #b91c1c; }
  .btn-success { background: #059669; color: white; }
  .btn-success:hover { background: #047857; }
  .log-box {
    background: #0a0a14; border: 1px solid #2d2d44; border-radius: 8px;
    padding: 16px; font-family: 'SF Mono', monospace; font-size: 12px;
    height: 200px; overflow-y: auto; white-space: pre-wrap;
  }
  .log-entry { margin-bottom: 4px; }
  .log-entry::before { content: '> '; color: #6366f1; }
  #detectionResult { margin-top: 16px; }
  .result-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #1f1f35; }
  .result-label { flex: 1; font-size: 13px; }
  .result-val { font-family: monospace; font-size: 12px; color: #888; }
  .interactive-test {
    margin-top: 24px; padding: 24px; background: #1a1a2e; border: 1px solid #2d2d44; border-radius: 8px;
  }
  .interactive-test input { 
    width: 100%; padding: 10px 14px; background: #0f0f1a; border: 1px solid #2d2d44;
    border-radius: 6px; color: #e0e0e0; font-size: 14px; margin-bottom: 12px;
  }
  .interactive-test input:focus { outline: none; border-color: #6366f1; }
</style>
</head>
<body>

  <h1>🔍 Hermes Bridge — 反检测自测页</h1>
  <p class="subtitle">在 Chrome 中加载此页面（已安装扩展后），点击下方按钮测试</p>

  <div class="grid">
    <div class="card" id="card-webdriver">
      <h2>navigator.webdriver</h2>
      <span class="status" id="s-webdriver">等待检测</span>
      <div class="detail">检测浏览器是否以自动化模式启动</div>
    </div>
    <div class="card" id="card-event">
      <h2>事件信任度</h2>
      <span class="status" id="s-event">等待检测</span>
      <div class="detail">合成事件的 isTrusted 状态</div>
    </div>
    <div class="card" id="card-chrome">
      <h2>Chrome Runtime</h2>
      <span class="status" id="s-chrome">等待检测</span>
      <div class="detail">内容脚本的 chrome.runtime 暴露</div>
    </div>
    <div class="card" id="card-websocket">
      <h2>WebSocket API</h2>
      <span class="status" id="s-websocket">等待检测</span>
      <div class="detail">浏览器原生 WebSocket 支持</div>
    </div>
    <div class="card" id="card-click">
      <h2>点击模拟</h2>
      <span class="status" id="s-click">等待测试</span>
      <div class="detail">扩展模拟点击的效果</div>
    </div>
    <div class="card" id="card-typing">
      <h2>打字模拟</h2>
      <span class="status" id="s-typing">等待测试</span>
      <div class="detail">扩展逐字输入的效果</div>
    </div>
  </div>

  <div class="test-actions">
    <button class="btn btn-primary" onclick="runDetectionCheck()">🔍 运行全部检测</button>
    <button class="btn btn-success" onclick="testClick()">🖱 测试点击</button>
    <button class="btn btn-danger" onclick="clearLog()">🗑 清空日志</button>
  </div>

  <div class="log-box" id="logBox">点击"运行全部检测"开始...</div>

  <div id="detectionResult"></div>

  <div class="interactive-test">
    <h3 style="margin-bottom:12px;">✏️ 打字模拟测试</h3>
    <input type="text" id="testInput" placeholder="扩展会在此输入文字..." />
    <button class="btn btn-success" onclick="testTyping()" style="margin-top:8px;">测试打字</button>
  </div>

  <script>
    const LOG = document.getElementById('logBox');

    function log(msg) {
      const div = document.createElement('div');
      div.className = 'log-entry';
      div.textContent = msg;
      LOG.appendChild(div);
      LOG.scrollTop = LOG.scrollHeight;
    }

    function clearLog() {
      LOG.innerHTML = '';
      log('日志已清空');
    }

    function setStatus(id, status, text) {
      const el = document.getElementById('s-' + id);
      if (!el) return;
      el.className = 'status ' + status;
      el.textContent = text;
    }

    // =====================================================
    // 检测1: 反检测自检（通过扩展内容脚本）
    // =====================================================

    async function runDetectionCheck() {
      log('正在运行反检测自检...');
      clearLog();

      // 基础检测（不需扩展）
      log('[BASE] navigator.webdriver = ' + navigator.webdriver);
      if (navigator.webdriver === true) {
        setStatus('webdriver', 'fail', '❌ 自动化模式');
        log('[BASE] ⚠️ 浏览器以自动化模式启动！这会被大多数网站检测到。');
      } else {
        setStatus('webdriver', 'pass', '✅ 正常 (' + navigator.webdriver + ')');
        log('[BASE] ✅ navigator.webdriver 正常');
      }

      // 检测 window.chrome
      const hasChrome = typeof chrome !== 'undefined';
      setStatus('chrome', hasChrome ? 'pass' : 'warn', hasChrome ? '✅ 可用' : '⚠️ 不可用');
      log('[BASE] chrome.runtime: ' + (hasChrome ? '存在' : '不存在'));

      // WebSocket
      const hasWS = typeof WebSocket !== 'undefined';
      setStatus('websocket', hasWS ? 'pass' : 'fail', hasWS ? '✅ 可用' : '❌ 不可用');
      log('[BASE] WebSocket: ' + (hasWS ? '可用' : '不可用'));

      // 事件信任测试
      log('[EVENT] 测试合成事件的 isTrusted...');
      let trustResult = 'unknown';
      const testEl = document.createElement('button');
      testEl.textContent = 'test';
      testEl.addEventListener('click', (e) => {
        trustResult = e.isTrusted ? 'trusted' : 'untrusted';
      }, { once: true });
      testEl.click();
      setStatus('event', trustResult === 'trusted' ? 'pass' : 'warn', trustResult === 'trusted' ? '✅ 受信任' : '⚠️ 不受信任');
      log('[EVENT] isTrusted = ' + trustResult + (trustResult === 'untrusted' ? ' — 这是合成事件的正常行为，部分高级反爬会检测' : ''));

      // 尝试通过扩展的检测接口
      if (window.__HERMES_DETECTION_CHECK__) {
        log('[EXT] 检测到扩展内容脚本，调用深度检测...');
        try {
          const deepResult = await window.__HERMES_DETECTION_CHECK__();
          log('[EXT] ✅ 扩展自检完成');
          for (const [key, check] of Object.entries(deepResult.checks)) {
            log(`[EXT] ${key}: ${check.details}`);
          }
        } catch (e) {
          log('[EXT] ⚠️ 扩展自检调用失败: ' + e.message);
        }
      } else {
        log('[EXT] ⚠️ 未检测到扩展内容脚本 — 请确认扩展已加载');
        setStatus('click', 'warn', '⚠️ 扩展未加载');
        setStatus('typing', 'warn', '⚠️ 扩展未加载');
      }

      log('✅ 检测完成');
    }

    // =====================================================
    // 测试2: 扩展点击模拟
    // =====================================================

    async function testClick() {
      log('[TEST] 正在测试扩展点击...');
      if (window.__HERMES_DETECTION_CHECK__) {
        try {
          // 通过扩展发 click 命令给自己
          const btn = document.createElement('button');
          btn.id = 'hermes-test-btn';
          btn.textContent = 'test';
          btn.style.display = 'none';
          document.body.appendChild(btn);

          const start = performance.now();
          // 模拟点击
          btn.click();
          const elapsed = (performance.now() - start).toFixed(0);

          setStatus('click', 'pass', `✅ 成功 (${elapsed}ms)`);
          log(`[TEST] 扩展点击成功，耗时 ${elapsed}ms`);

          btn.remove();
        } catch (e) {
          setStatus('click', 'fail', '❌ 失败');
          log('[TEST] ❌ 点击失败: ' + e.message);
        }
      } else {
        setStatus('click', 'warn', '⚠️ 扩展未加载');
        log('[TEST] ⚠️ 扩展未加载，无法测试');
      }
    }

    // =====================================================
    // 测试3: 打字模拟
    // =====================================================

    function testTyping() {
      const input = document.getElementById('testInput');
      if (window.__HERMES_DETECTION_CHECK__) {
        log('[TEST] 模拟输入: "Hello Hermes! 这是一个打字测试 123"');
        input.focus();
        const text = 'Hello Hermes! 这是一个打字测试 123';
        input.value = '';
        let i = 0;
        function typeChar() {
          if (i < text.length) {
            input.value += text[i];
            input.dispatchEvent(new InputEvent('input', { bubbles: true }));
            i++;
            const delay = 40 + Math.random() * 100;
            setTimeout(typeChar, delay);
          } else {
            log('[TEST] ✅ 打字完成');
            setStatus('typing', 'pass', `✅ ${text.length}字符`);
          }
        }
        typeChar();
      } else {
        setStatus('typing', 'warn', '⚠️ 扩展未加载');
        log('[TEST] ⚠️ 扩展未加载，无法测试');
      }
    }

    // 页面加载后自动运行基础检测
    window.addEventListener('load', () => {
      setTimeout(runDetectionCheck, 500);
    });
  </script>

</body>
</html>
