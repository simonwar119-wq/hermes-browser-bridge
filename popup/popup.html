<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #1a1a2e;
      --fg: #e0e0e0;
      --accent: #6366f1;
      --green: #22c55e;
      --red: #ef4444;
      --gray: #6b7280;
      --card: #16162a;
      --border: #2a2a40;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      font-size: 13px;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .header-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }
    .version {
      font-size: 10px;
      background: var(--card);
      color: var(--gray);
      padding: 2px 8px;
      border-radius: 8px;
    }
    .page-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      margin-bottom: 12px;
    }
    .page-label {
      font-size: 10px;
      color: var(--gray);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 3px;
    }
    .page-title {
      font-size: 12px;
      color: var(--fg);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .page-url {
      font-size: 10px;
      color: var(--gray);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .open-btn {
      width: 100%;
      padding: 11px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
      transition: opacity 0.15s;
    }
    .open-btn:hover { opacity: 0.88; }
    .feature-list {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .chip {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3px 9px;
      font-size: 10px;
      color: var(--gray);
    }
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 10px 0;
    }
    .bridge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .bridge-left {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--gray);
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.on  { background: var(--green); }
    .dot.off { background: var(--gray); }
    .bridge-actions { display: flex; gap: 6px; }
    .bridge-btn {
      padding: 4px 12px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--card);
      color: var(--fg);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .bridge-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .bridge-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .bridge-hint {
      font-size: 10px;
      color: var(--gray);
      margin-top: 6px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-title">🧠 Hermes AI</span>
    <span class="version">v3.1</span>
  </div>

  <div class="page-card">
    <div class="page-label">当前页面</div>
    <div class="page-title" id="pageTitle">加载中...</div>
    <div class="page-url" id="pageUrl"></div>
  </div>

  <button class="open-btn" id="openSidePanel">💬 打开 AI 聊天侧边栏</button>

  <div class="feature-list">
    <span class="chip">📝 总结</span>
    <span class="chip">🔬 分析</span>
    <span class="chip">📷 截图</span>
    <span class="chip">🌐 导航</span>
    <span class="chip">🖱️ 点击</span>
    <span class="chip">✏️ 填表</span>
  </div>

  <hr class="divider">

  <div class="bridge-row">
    <div class="bridge-left">
      <span class="dot off" id="bridgeDot"></span>
      <span id="bridgeStatus">Bridge 未连接</span>
    </div>
    <div class="bridge-actions">
      <button class="bridge-btn" id="bridgeConnectBtn">连接</button>
      <button class="bridge-btn" id="bridgeDisconnectBtn" disabled>断开</button>
    </div>
  </div>
  <div class="bridge-hint">Bridge 用于 Hermes Agent 外部自动化（可选）</div>

  <script src="popup.js"></script>
</body>
</html>
