<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #1a1a2e;
      --fg: #e0e0e0;
      --accent: #6366f1;
      --green: #22c55e;
      --red: #ef4444;
      --gray: #6b7280;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      min-height: 200px;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--gray);
    }
    .status-dot.connected { background: var(--green); }
    .status-dot.disconnected { background: var(--red); }
    .status-text { font-size: 12px; color: var(--gray); }
    .info { font-size: 11px; color: var(--gray); margin-bottom: 12px; line-height: 1.5; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-connect { background: var(--accent); color: white; }
    .btn-disconnect { background: #374151; color: #ccc; }
    .btn-connect.connected { background: var(--green); }
    .config { margin-top: 12px; padding-top: 12px; border-top: 1px solid #2d2d44; }
    .config label { font-size: 11px; color: var(--gray); display: block; margin-bottom: 4px; }
    .config input {
      width: 100%;
      padding: 6px 8px;
      background: #16162a;
      border: 1px solid #2d2d44;
      border-radius: 4px;
      color: var(--fg);
      font-size: 11px;
      margin-bottom: 8px;
    }
    .config input:focus { outline: none; border-color: var(--accent); }
    .log {
      margin-top: 12px;
      padding: 8px;
      background: #16162a;
      border-radius: 4px;
      font-size: 10px;
      font-family: 'SF Mono', 'Menlo', monospace;
      color: var(--gray);
      max-height: 80px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1>🔌 Hermes Bridge</h1>

  <div class="status-row">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Disconnected</span>
  </div>

  <div class="info" id="tabInfo">No active tab detected</div>

  <div>
    <button class="btn btn-connect" id="connectBtn">Connect</button>
    <button class="btn btn-disconnect" id="disconnectBtn" disabled>Disconnect</button>
  </div>

  <div class="config">
    <label>Bridge Server Host</label>
    <input type="text" id="bridgeHost" value="127.0.0.1" />
    <label>Bridge Server Port</label>
    <input type="text" id="bridgePort" value="8643" />
  </div>

  <div class="log" id="log">Ready.</div>

  <script src="popup.js"></script>
</body>
</html>
