<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #1a1a2e;
      --fg: #e0e0e0;
      --accent: #6366f1;
      --green: #22c55e;
      --red: #ef4444;
      --gray: #6b7280;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      min-height: 240px;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .version-tag {
      font-size: 10px;
      background: #2d2d44;
      color: var(--gray);
      padding: 2px 8px;
      border-radius: 8px;
      font-weight: 400;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--gray);
    }
    .status-dot.connected { background: var(--green); }
    .status-dot.disconnected { background: var(--red); }
    .status-text { font-size: 12px; color: var(--gray); }
    .info {
      font-size: 11px;
      color: var(--gray);
      margin-bottom: 10px;
      line-height: 1.5;
      word-break: break-all;
      background: #16162a;
      padding: 8px;
      border-radius: 6px;
    }
    .info .label {
      color: var(--gray);
      font-size: 10px;
    }
    .info .value {
      color: var(--fg);
      display: block;
    }
    .quick-actions {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .quick-btn {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #2d2d44;
      border-radius: 5px;
      background: #16162a;
      color: var(--fg);
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .quick-btn:hover {
      background: #2d2d44;
      border-color: var(--accent);
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
      flex: 1;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-connect { background: var(--accent); color: white; }
    .btn-disconnect { background: #374151; color: #ccc; }
    .btn-connect.connected { background: var(--green); }
    .config { padding-top: 10px; border-top: 1px solid #2d2d44; }
    .config label { font-size: 11px; color: var(--gray); display: block; margin-bottom: 4px; }
    .config input {
      width: 100%;
      padding: 6px 8px;
      background: #16162a;
      border: 1px solid #2d2d44;
      border-radius: 4px;
      color: var(--fg);
      font-size: 11px;
      margin-bottom: 6px;
    }
    .config input:focus { outline: none; border-color: var(--accent); }
    .config-row {
      display: flex;
      gap: 8px;
    }
    .config-row input { flex: 1; }
    .log {
      margin-top: 8px;
      padding: 6px 8px;
      background: #16162a;
      border-radius: 4px;
      font-size: 10px;
      font-family: 'SF Mono', 'Menlo', monospace;
      color: var(--gray);
      max-height: 60px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1>
    🔌 Hermes Bridge
    <span class="version-tag">v1.1</span>
  </h1>

  <div class="status-row">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Disconnected</span>
    <span style="flex:1"></span>
    <span style="font-size:10px;color:var(--gray)" id="reconnectInfo"></span>
  </div>

  <div class="info" id="tabInfo">
    <span class="label">当前页面</span>
    <span class="value" id="tabDetail">未检测到标签页</span>
  </div>

  <!-- 快捷操作 -->
  <div class="quick-actions">
    <button class="quick-btn" id="btnSummarize">📝 总结</button>
    <button class="quick-btn" id="btnAnalyze">🔬 分析</button>
  </div>

  <div class="btn-group">
    <button class="btn btn-connect" id="connectBtn">🔗 Connect</button>
    <button class="btn btn-disconnect" id="disconnectBtn" disabled>⛓️ Disconnect</button>
  </div>

  <div class="config">
    <label>Bridge Server</label>
    <div class="config-row">
      <input type="text" id="bridgeHost" value="127.0.0.1" placeholder="Host" />
      <input type="text" id="bridgePort" value="8643" placeholder="Port" style="width:80px;flex:0 0 80px" />
    </div>
  </div>

  <div class="log" id="log">Ready.</div>

  <script src="popup.js"></script>
</body>
</html>
