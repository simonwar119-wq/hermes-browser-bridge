<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hermes AI Assistant Docs</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f5f7fb 0%, #eef2ff 100%);
      color: #111827;
    }
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 56px 24px 80px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 22px;
      padding: 32px;
      box-shadow: 0 18px 40px rgba(17, 24, 39, 0.08);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 36px;
      line-height: 1.1;
    }
    p {
      font-size: 16px;
      line-height: 1.7;
      color: #374151;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    a.button {
      display: inline-block;
      padding: 12px 16px;
      border-radius: 12px;
      background: #4f46e5;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    a.link {
      display: inline-block;
      padding: 12px 16px;
      border-radius: 12px;
      background: #eef2ff;
      color: #312e81;
      text-decoration: none;
      font-weight: 600;
    }
    code {
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Hermes AI Assistant</h1>
      <p>This repository contains public compliance documents for the Hermes AI Assistant Chrome extension.</p>
      <p>For Chrome Web Store review, use the privacy policy page below as the public policy URL after enabling GitHub Pages for the repository <code>docs/</code> folder.</p>
      <div class="actions">
        <a class="button" href="./privacy-policy.html">Open Privacy Policy</a>
      </div>
    </div>
  </main>
</body>
</html>
